services:
  - type: web
    name: web3d-connector
    runtime: docker
    plan: free              # reicht, weil das Image ohne Chromium schlank ist
    healthCheckPath: /
    envVars:
      - key: MCP_TOKEN
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: STATE_REPO     # optional: owner/name eines Repos fuer die automatische Sicherung
        sync: false
