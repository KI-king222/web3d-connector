<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web3D Steuerung</title>
<style>
:root{--bg:#0f0f14;--card:#1a1a22;--line:#2b2b38;--fg:#f2f2f5;--mut:#9a9aab;--acc:#00c2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:20px;margin:14px 0 8px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}
input,select,textarea,button{width:100%;font:inherit;color:var(--fg);background:#101018;border:1px solid var(--line);border-radius:10px;padding:11px}
textarea{min-height:60px;font-family:ui-monospace,monospace;font-size:13px}
button{background:var(--acc);color:#001018;border:0;font-weight:600;margin-top:10px}
button.sec{background:#2a2a38;color:var(--fg)}button.del{background:#40202a;color:#ff9aaa;width:auto;margin:0;padding:6px 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
iframe{width:100%;height:50vh;border:1px solid var(--line);border-radius:12px;background:#000}
pre{white-space:pre-wrap;word-break:break-word;background:#101018;border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
img{width:100%;border-radius:10px;margin:6px 0}.err{color:#ff9aaa}
.part{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hide{display:none}.busy{opacity:.6;pointer-events:none}
</style></head><body>

<div id="login" class="card hide">
  <h2>Anmelden</h2>
  <label>MCP_TOKEN (aus Render → Environment)</label>
  <input id="tok" type="password" autocomplete="off" autocapitalize="off">
  <button id="loginBtn">Anmelden</button>
  <pre id="loginErr" class="err"></pre>
</div>

<div id="app" class="hide">
  <h1>Web3D Steuerung</h1>

  <div class="card">
    <h2>Projekt</h2>
    <select id="proj"></select>
    <div class="row"><button class="sec" id="reload">Vorschau neu laden</button><a id="openPrev" target="_blank" style="text-decoration:none"><button class="sec">Vollbild öffnen</button></a></div>
    <iframe id="prev"></iframe>
    <div class="row"><button class="sec" id="shotIso">Screenshot (iso)</button><button class="sec" id="shotAll">4 Ansichten</button></div>
    <div class="row"><button class="sec" id="validate">Code prüfen</button><button class="sec" id="listParts">Teile anzeigen</button></div>
    <div id="parts"></div>
  </div>

  <div class="card">
    <h2>Bauteil hinzufügen</h2>
    <div class="row">
      <div><label>Teil</label><select id="kind">
        <option value="system">Kompletter PC</option><option value="case">Gehäuse</option><option value="motherboard">Mainboard</option>
        <option value="cpu">CPU</option><option value="cooler">Luftkühler</option><option value="aio">Wasserkühlung</option>
        <option value="ram">RAM</option><option value="gpu">Grafikkarte</option><option value="ssd_sata">SATA-SSD</option>
        <option value="ssd_m2">M.2-SSD</option><option value="hdd">HDD</option><option value="psu">Netzteil</option><option value="fan">Lüfter</option>
      </select></div>
      <div><label>Design</label><select id="variant"><option>stealth</option><option>white</option><option>rgb</option><option>retro</option></select></div>
    </div>
    <div class="row"><div><label>Akzentfarbe</label><input id="accent" type="color" value="#00e5ff"></div><div><label>Farbe verwenden</label><select id="useAccent"><option value="0">Theme-Farbe</option><option value="1">Eigene Farbe</option></select></div></div>
    <label>Position x / y / z (1 Einheit = 10 cm)</label>
    <div class="row3"><input id="px" type="number" value="0" step="0.5"><input id="py" type="number" value="0" step="0.5"><input id="pz" type="number" value="0" step="0.5"></div>
    <label>Optionen (JSON, optional), z. B. {"preset":"flagship"}</label>
    <textarea id="opts" placeholder="{}"></textarea>
    <button id="add">Hinzufügen</button>
    <button class="sec" id="catalog">Katalog &amp; Optionen anzeigen</button>
  </div>

  <div class="card">
    <h2>Neues Projekt</h2>
    <label>Name (Buchstaben, Zahlen, - und _)</label>
    <input id="newName" autocapitalize="off">
    <button id="create">Anlegen</button>
  </div>

  <div class="card">
    <h2>GitHub</h2>
    <label>Repo (owner/name)</label><input id="repo" autocapitalize="off" placeholder="benji/mein-spiel">
    <div class="row"><div><label>Branch</label><input id="branch" value="main"></div><div><label>Unterordner</label><input id="subdir" value="pc-designs" autocapitalize="off"></div></div>
    <label>Nur diese Dateien (optional, mit Komma)</label><input id="only" placeholder="components.js,entities.json" autocapitalize="off">
    <div class="row"><button id="push">Push → GitHub</button><button class="sec" id="pull">Pull ← GitHub</button></div>
  </div>

  <div class="card"><h2>Ergebnis</h2><div id="out"></div></div>
  <button class="sec" id="logout">Abmelden</button>
</div>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem("w3d_tok") || "";

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { showLogin("Token falsch."); throw new Error("401"); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const tool = (name, args) => api("/api/tool", { name, args });

function show(res) {
  const out = $("#out"); out.innerHTML = "";
  if (res.isError) { const p = document.createElement("pre"); p.className = "err"; p.textContent = (res.content || []).map((c) => c.text).join("\n"); out.append(p); return; }
  for (const c of res.content || []) {
    if (c.type === "text") { const p = document.createElement("pre"); p.textContent = c.text; out.append(p); }
    else if (c.type === "image") { const i = new Image(); i.src = `data:${c.mimeType};base64,${c.data}`; out.append(i); }
  }
  out.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
async function run(btn, fn) {
  btn.classList.add("busy");
  try { show(await fn()); } catch (e) { if (e.message !== "401") show({ isError: true, content: [{ text: e.message }] }); }
  btn.classList.remove("busy");
}
const proj = () => $("#proj").value;

function showLogin(msg) { $("#app").classList.add("hide"); $("#login").classList.remove("hide"); $("#loginErr").textContent = msg || ""; }
async function start() {
  try { await loadProjects(); $("#login").classList.add("hide"); $("#app").classList.remove("hide"); }
  catch (e) { if (e.message !== "401") showLogin(e.message); }
}
async function loadProjects(select) {
  const { projects } = await api("/api/projects");
  const sel = $("#proj"); const cur = select || sel.value;
  sel.innerHTML = projects.map((p) => `<option value="${p.name}">${p.name} (${p.parts} Teile)</option>`).join("") || "<option value=''>Noch kein Projekt</option>";
  if (cur && projects.some((p) => p.name === cur)) sel.value = cur;
  setPreview();
}
function setPreview() {
  const p = proj(); const url = p ? `/preview/${p}/` : "about:blank";
  $("#prev").src = url; $("#openPrev").href = url;
}

$("#loginBtn").onclick = () => { token = $("#tok").value.trim(); localStorage.setItem("w3d_tok", token); start(); };
$("#logout").onclick = () => { localStorage.removeItem("w3d_tok"); token = ""; showLogin(""); };
$("#proj").onchange = () => { setPreview(); $("#parts").innerHTML = ""; };
$("#reload").onclick = () => { $("#prev").src = $("#prev").src; };

$("#shotIso").onclick = (e) => run(e.target, () => tool("screenshot", { project: proj(), views: ["iso"], width: 640, height: 480 }));
$("#shotAll").onclick = (e) => run(e.target, () => tool("screenshot", { project: proj(), views: ["front", "side", "top", "iso"], width: 640, height: 480 }));
$("#validate").onclick = (e) => run(e.target, () => tool("validate_project", { project: proj() }));
$("#catalog").onclick = (e) => run(e.target, () => tool("list_parts", {}));

async function renderParts() {
  const { entities } = await api("/api/entities?project=" + encodeURIComponent(proj()));
  const box = $("#parts"); box.innerHTML = entities.length ? "" : "<pre>Noch keine Teile.</pre>";
  entities.forEach((en, i) => {
    const d = document.createElement("div"); d.className = "part";
    const s = document.createElement("span"); s.textContent = `${i + 1}. ${en.name || en.kind || en.type} (${en.variant || "-"}) @ ${(en.position || []).join(", ")}`;
    const b = document.createElement("button"); b.className = "del"; b.textContent = "Löschen";
    b.onclick = async () => { await tool("remove_entity", { project: proj(), index: i }); await renderParts(); await loadProjects(); $("#prev").src = $("#prev").src; };
    d.append(s, b); box.append(d);
  });
}
$("#listParts").onclick = (e) => run(e.target, async () => { await renderParts(); return { content: [{ type: "text", text: "Teile aktualisiert." }] }; });

$("#add").onclick = (e) => run(e.target, async () => {
  let options; const raw = $("#opts").value.trim();
  if (raw) { try { options = JSON.parse(raw); } catch { throw new Error("Optionen sind kein gültiges JSON."); } }
  const args = { project: proj(), kind: $("#kind").value, variant: $("#variant").value, position: [+$("#px").value, +$("#py").value, +$("#pz").value] };
  if ($("#useAccent").value === "1") args.accent = $("#accent").value;
  if (options) args.options = options;
  const res = await tool("add_pc_component", args);
  await loadProjects(); $("#prev").src = $("#prev").src; if ($("#parts").innerHTML) await renderParts();
  return res;
});

$("#create").onclick = (e) => run(e.target, async () => {
  const name = $("#newName").value.trim();
  const res = await tool("scaffold_game", { project: name, template: "showcase" });
  await loadProjects(name); return res;
});

const gh = () => {
  const repo = $("#repo").value.trim(); localStorage.setItem("w3d_repo", repo);
  return { project: proj(), repo, branch: $("#branch").value.trim() || "main", subdir: $("#subdir").value.trim() };
};
$("#push").onclick = (e) => run(e.target, () => {
  const a = gh(); const only = $("#only").value.split(",").map((s) => s.trim()).filter(Boolean);
  if (only.length) a.only = only; return tool("github_push", a);
});
$("#pull").onclick = (e) => run(e.target, async () => { const r = await tool("github_pull", gh()); await loadProjects(); return r; });

$("#repo").value = localStorage.getItem("w3d_repo") || "";
if (token) start(); else showLogin("");
</script>
</body></html>
