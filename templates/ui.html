<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web3D Steuerung</title>
<style>
:root{--bg:#0f0f14;--card:#1a1a22;--line:#2b2b38;--fg:#f2f2f5;--mut:#9a9aab;--acc:#00c2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:20px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
input,select,button,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#121218;color:var(--fg);font-size:16px}
button{background:var(--acc);color:#001018;font-weight:700;border:0;cursor:pointer}
button.sec{background:#2a2a36;color:var(--fg)}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--mut);max-height:180px;overflow:auto}
iframe{width:100%;height:280px;border:0;border-radius:12px;background:#000}
.ok{color:#4caf50}.err{color:#ff6b6b}
#login{max-width:420px;margin:40px auto}
#app{display:none}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{flex:0 0 auto;width:auto;padding:8px 14px;font-size:13px}
.tabs button.on{outline:2px solid var(--acc)}
</style></head><body>
<div id="login" class="card">
  <h1>Web3D Connector</h1>
  <p style="color:var(--mut);font-size:14px">Mit dem MCP-Token anmelden (steht in Render → Environment).</p>
  <label>MCP Token</label>
  <input id="tok" type="password" autocomplete="current-password" placeholder="Bearer-Token">
  <button id="go" style="margin-top:12px">Anmelden</button>
  <pre id="loginMsg"></pre>
</div>
<div id="app">
  <h1>Web3D Steuerung</h1>
  <div class="tabs">
    <button class="on" data-tab="proj">Projekt</button>
    <button data-tab="parts">Bauteile</button>
    <button data-tab="shot">Screenshot</button>
    <button data-tab="gh">GitHub</button>
  </div>
  <div id="tab-proj" class="card">
    <label>Projekt</label>
    <select id="proj"></select>
    <div class="row" style="margin-top:10px">
      <button id="newProj">Neu (showcase)</button>
      <button class="sec" id="reload">Aktualisieren</button>
    </div>
    <label style="margin-top:12px">Live-Vorschau</label>
    <iframe id="prev"></iframe>
  </div>
  <div id="tab-parts" class="card" style="display:none">
    <label>Art</label>
    <select id="kind">
      <option>gpu</option><option>cooler</option><option>ram</option><option>motherboard</option>
      <option>psu</option><option>case</option><option>fan</option><option>cpu</option><option>aio</option>
    </select>
    <label>Theme</label>
    <select id="variant"><option>stealth</option><option>white</option><option>rgb</option><option>retro</option></select>
    <div class="row">
      <div><label>X</label><input id="px" type="number" value="0" step="0.1"></div>
      <div><label>Y</label><input id="py" type="number" value="0" step="0.1"></div>
      <div><label>Z</label><input id="pz" type="number" value="0" step="0.1"></div>
    </div>
    <button id="addPart" style="margin-top:12px">Bauteil hinzufügen</button>
    <button class="sec" id="listParts" style="margin-top:8px">Katalog anzeigen</button>
  </div>
  <div id="tab-shot" class="card" style="display:none">
    <label>Ansicht</label>
    <select id="view"><option>iso</option><option>front</option><option>side</option><option>top</option></select>
    <label>Theme (optional)</label>
    <select id="shotTheme"><option value="">—</option><option>stealth</option><option>white</option><option>rgb</option><option>retro</option></select>
    <button id="shot" style="margin-top:12px">Screenshot</button>
    <div id="shotOut" style="margin-top:10px"></div>
  </div>
  <div id="tab-gh" class="card" style="display:none">
    <label>GitHub Repo (owner/name)</label>
    <input id="repo" placeholder="KI-king222/web3d-connector">
    <label>Unterordner (subdir)</label>
    <input id="subdir" placeholder="pc-designs">
    <div class="row" style="margin-top:10px">
      <button id="push">Push</button>
      <button class="sec" id="pull">Pull</button>
    </div>
  </div>
  <div class="card"><pre id="log"></pre></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem("w3d_token") || "";
const log = (t, cls) => { const el = $("#log"); el.className = cls || ""; el.textContent = typeof t === "string" ? t : JSON.stringify(t, null, 2); };
async function tool(name, args = {}) {
  const r = await fetch("/api/tool", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ name, arguments: args }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showLogin(msg) { $("#login").style.display = "block"; $("#app").style.display = "none"; $("#loginMsg").textContent = msg || ""; }
function showApp() { $("#login").style.display = "none"; $("#app").style.display = "block"; }
async function loadProjects() {
  const r = await tool("list_files", { path: "." });
  const text = (r.content && r.content[0] && r.content[0].text) || "";
  const names = text.split("\n").map((s) => s.trim()).filter(Boolean);
  const sel = $("#proj");
  sel.innerHTML = "";
  for (const n of names) { const o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o); }
  if (names[0]) setPreview(names[0]);
}
function setPreview(name) { $("#prev").src = "/preview/" + encodeURIComponent(name) + "/?t=" + Date.now(); }
async function start() {
  try { await loadProjects(); showApp(); log("Bereit.", "ok"); }
  catch (e) { showLogin(String(e.message || e)); localStorage.removeItem("w3d_token"); token = ""; }
}
$("#go").onclick = async () => {
  token = $("#tok").value.trim();
  if (!token) return;
  localStorage.setItem("w3d_token", token);
  await start();
};
$("#reload").onclick = () => run($("#reload"), loadProjects);
$("#proj").onchange = () => setPreview($("#proj").value);
$("#newProj").onclick = (e) => run(e.target, async () => {
  const name = "pc-" + Date.now().toString(36);
  await tool("scaffold_game", { name, template: "showcase" });
  await loadProjects();
  $("#proj").value = name;
  setPreview(name);
  return "Projekt " + name + " angelegt";
});
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("on"));
  b.classList.add("on");
  ["proj", "parts", "shot", "gh"].forEach((t) => { $("#tab-" + t).style.display = b.dataset.tab === t ? "block" : "none"; });
});
async function run(btn, fn) {
  btn.disabled = true;
  try { log(await fn(), "ok"); }
  catch (e) { log(String(e.message || e), "err"); }
  finally { btn.disabled = false; }
}
$("#addPart").onclick = (e) => run(e.target, async () => {
  const name = $("#proj").value;
  if (!name) throw new Error("Kein Projekt");
  return tool("add_pc_component", {
    project: name,
    kind: $("#kind").value,
    variant: $("#variant").value,
    position: [+$("#px").value, +$("#py").value, +$("#pz").value],
  });
});
$("#listParts").onclick = (e) => run(e.target, () => tool("list_parts"));
$("#shot").onclick = (e) => run(e.target, async () => {
  const name = $("#proj").value;
  if (!name) throw new Error("Kein Projekt");
  const args = { project: name, views: [$("#view").value] };
  const th = $("#shotTheme").value; if (th) args.theme = th;
  const r = await tool("screenshot", args);
  const out = $("#shotOut"); out.innerHTML = "";
  const imgs = (r.content || []).filter((c) => c.type === "image");
  for (const im of imgs) {
    const img = document.createElement("img");
    img.src = "data:" + (im.mimeType || "image/png") + ";base64," + im.data;
    img.style = "max-width:100%;border-radius:10px;margin-top:8px";
    out.appendChild(img);
  }
  return imgs.length ? imgs.length + " Bild(er)" : r;
});
const gh = () => ({ repo: $("#repo").value.trim(), subdir: $("#subdir").value.trim() || undefined, project: $("#proj").value });
$("#push").onclick = (e) => run(e.target, async () => {
  const a = gh(); if (!a.repo) throw new Error("Repo fehlt");
  localStorage.setItem("w3d_repo", a.repo);
  a.only = undefined; return tool("github_push", a);
});
$("#pull").onclick = (e) => run(e.target, async () => { const r = await tool("github_pull", gh()); await loadProjects(); return r; });

$("#repo").value = localStorage.getItem("w3d_repo") || "";
if (token) start(); else showLogin("");
</script>
</body></html>
